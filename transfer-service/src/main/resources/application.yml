spring:
  application:
    name: transfer-service
  datasource:
    url: jdbc:postgresql://localhost:5432/transfers
    username: wallet
    password: wallet
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 500ms
          multiplier: 2

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

logging:
  pattern:
    level: "%5p [trace=%X{traceId:-}]"